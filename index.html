<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CA Foundation Revision Tracker</title>

  <!-- WhatsApp & Social Media Preview Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="CA Foundation Revision Tracker">
  <meta property="og:description" content="Track your ICAI syllabus units, RTPs, and Mock Tests privately on your mobile.">
  <meta property="og:url" content="https://akhilanayanantriplei-jpg.github.io/CA-Revision-Tracker---Foundation/">
  <meta property="og:image" content="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=1200&auto=format&fit=crop&q=80">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #2563eb;
      --success: #16a34a;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--text); padding-bottom: 40px; }
    .container { max-width: 500px; margin: 0 auto; padding: 14px; }
    .card { background: var(--card); border-radius: 14px; padding: 18px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04); margin-bottom: 16px; }
    h2, h3 { margin: 0 0 10px 0; color: var(--primary); }
    label { font-size: 13px; font-weight: 600; color: #334155; display: block; margin-top: 14px; }
    select, input[type="number"], input[type="date"], button {
      width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; margin-top: 6px; font-size: 15px; outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
    button { background: var(--primary); color: white; border: none; font-weight: 700; cursor: pointer; margin-top: 18px; transition: background 0.2s; }
    button:active { background: #172554; }
    .chap-details { border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; overflow: hidden; background: #fff; }
    .chap-summary { padding: 10px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
    .chap-units { padding: 6px 12px; background: #ffffff; }
    .unit-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; line-height: 1.35; }
    .unit-item:last-child { border-bottom: none; }
    .unit-item input[type="checkbox"] { margin-top: 2px; width: 17px; height: 17px; cursor: pointer; }
    .progress-track { background: #e2e8f0; border-radius: 999px; height: 12px; overflow: hidden; margin: 6px 0 14px; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s ease; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; background: #e0f2fe; color: #0369a1; }
    .hidden { display: none; }
    .sub-section { background: var(--primary-light); border-radius: 8px; padding: 12px; margin-top: 14px; border: 1px solid #bfdbfe; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
  </style>
</head>
<body>
<div class="container">

  <!-- SCREEN 1: INPUT AND LOGGING -->
  <div id="page-input" class="card">
    <h2>Daily Revision Tracker</h2>
    <p style="font-size: 13px; color: var(--muted); margin: 0 0 12px;">Check completed chapters/units for today. Progress stays 100% private to your phone.</p>

    <label>Select Subject to Update:</label>
    <select id="subject-select" onchange="renderSubjectView()">
      <option value="p1">Paper 1: Accounting (100 Marks)</option>
      <option value="p2">Paper 2: Business Laws (100 Marks)</option>
      <option value="p3">Paper 3: Quantitative Aptitude (100 Marks)</option>
      <option value="p4">Paper 4: Business Economics (100 Marks)</option>
    </select>

    <!-- RTP & MOCK INPUTS FOR THIS SUBJECT -->
    <div class="sub-section">
      <div style="font-size:13px; font-weight:700; color:var(--primary); margin-bottom:8px;">Subject Practice Status:</div>
      <label class="unit-item" style="border:none; padding:2px 0;">
        <input type="checkbox" id="rtp-checkbox" onchange="updateRtp(this.checked)">
        <span><strong>ICAI Revision Test Paper (RTP) Completed</strong> for this subject</span>
      </label>
      <label style="margin-top:8px;">Mock Tests Written for this paper:</label>
      <input type="number" id="sub-mock-count" min="0" placeholder="e.g. 2" onchange="updateSubMock(this.value)">
    </div>

    <label style="margin-top:16px;">Syllabus Breakdown (Click chapter to toggle units):</label>
    <div id="chapters-accordion" style="margin-top:8px;"></div>

    <!-- OPTIONAL EXAM PLANNING ACCORDION -->
    <details style="margin-top:18px;">
      <summary style="font-size:13px; font-weight:700; color:var(--primary); cursor:pointer;">⚙️ Exam Countdown & Planning (Optional)</summary>
      <div style="background:#f8fafc; padding:12px; border-radius:8px; margin-top:8px; border:1px solid var(--border);">
        <label>Exam Start Date:</label>
        <input type="date" id="exam-date">
        <label>Target Revision Days/Half-Days per Subject:</label>
        <input type="number" id="target-days" placeholder="e.g. 12 days per paper">
      </div>
    </details>

    <button onclick="saveAndShowDashboard()">Save & View Progress Dashboard</button>
  </div>

  <!-- SCREEN 2: PROGRESS DASHBOARD -->
  <div id="page-dashboard" class="card hidden">
    <h2>Revision Readiness</h2>
    <div id="countdown-badge" class="badge" style="margin-bottom:12px;"></div>

    <div style="font-size:13px; font-weight:600; margin-top:8px;">
      Overall Exam Readiness (70% Syllabus + 15% RTPs + 15% Mocks)
    </div>
    <div class="progress-track"><div id="overall-bar" class="progress-fill" style="background:var(--success);"></div></div>
    <div id="overall-label" style="font-size:13px; font-weight:700; text-align:right; margin-top:-10px;">0% Ready</div>

    <h3 style="margin-top:20px;">Subject-Wise Completion</h3>
    <div id="subject-bars-container"></div>

    <div id="planning-summary" style="font-size:12px; color:var(--muted); border-top:1px solid var(--border); padding-top:10px; margin-top:10px;"></div>

    <button onclick="showInputPage()" style="background:#475569;">+ Log More Units / Edit Inputs</button>
  </div>

</div>

<script>
  // Full, complete ICAI New Scheme Syllabus tree
  const SYLLABUS_TREE = {
    p1: {
      name: "Paper 1: Accounting",
      chapters: [
        {
          title: "Ch 1: Theoretical Framework",
          units: [
            "Unit 1: Meaning and Scope of Accounting",
            "Unit 2: Accounting Concepts, Principles & Conventions",
            "Unit 3: Capital and Revenue Expenditures and Receipts",
            "Unit 4: Contingent Assets and Contingent Liabilities",
            "Unit 5: Accounting Policies",
            "Unit 6: Accounting as Measurement Discipline (Valuation Principles)",
            "Unit 7: Accounting Standards"
          ]
        },
        {
          title: "Ch 2: Accounting Process",
          units: [
            "Unit 1: Basic Accounting Procedures - Journal Entries",
            "Unit 2: Ledgers",
            "Unit 3: Trial Balance",
            "Unit 4: Subsidiary Books",
            "Unit 5: Cash Book",
            "Unit 6: Rectification of Errors"
          ]
        },
        {
          title: "Ch 3: Bank Reconciliation Statement (BRS)",
          units: ["Full Chapter Coverage & Illustrations"]
        },
        {
          title: "Ch 4: Inventories",
          units: ["Full Chapter Coverage & Valuation Methods"]
        },
        {
          title: "Ch 5: Depreciation and Amortisation",
          units: ["Full Chapter Coverage & Computation Methods"]
        },
        {
          title: "Ch 6: Bills of Exchange and Promissory Notes",
          units: ["Full Chapter Coverage, Endorsement & Dishonour"]
        },
        {
          title: "Ch 7: Final Accounts of Sole Proprietors",
          units: [
            "Unit 1: Final Accounts of Non-Manufacturing Entities",
            "Unit 2: Final Accounts of Manufacturing Entities"
          ]
        },
        {
          title: "Ch 8: Financial Statements of NPO",
          units: ["Full Chapter Coverage (Receipt & Payment, Income & Expenditure)"]
        },
        {
          title: "Ch 9: Accounts from Incomplete Records (Single Entry)",
          units: ["Full Chapter Coverage & Statement of Affairs"]
        },
        {
          title: "Ch 10: Partnership and LLP Accounts",
          units: [
            "Unit 1: Introduction to Partnership Accounts",
            "Unit 2: Treatment of Goodwill in Partnership Accounts",
            "Unit 3: Admission of a New Partner",
            "Unit 4: Retirement of a Partner",
            "Unit 5: Death of a Partner",
            "Unit 6: Dissolution of Partnership Firms and LLPs"
          ]
        },
        {
          title: "Ch 11: Company Accounts",
          units: [
            "Unit 1: Introduction to Company Accounts",
            "Unit 2: Issue, Forfeiture and Re-Issue of Shares",
            "Unit 3: Issue of Debentures",
            "Unit 4: Accounting for Bonus Issue and Right Issue",
            "Unit 5: Redemption of Preference Shares",
            "Unit 6: Redemption of Debentures"
          ]
        }
      ]
    },
    p2: {
      name: "Paper 2: Business Laws",
      chapters: [
        {
          title: "Ch 1: Indian Regulatory Framework",
          units: ["Regulatory Bodies, Legislative Process & Legal System"]
        },
        {
          title: "Ch 2: The Indian Contract Act, 1872",
          units: [
            "Unit 1: Nature of Contracts",
            "Unit 2: Consideration",
            "Unit 3: Other Essential Elements of a Contract",
            "Unit 4: Performance of Contract",
            "Unit 5: Breach of Contract and Its Remedies",
            "Unit 6: Contingent and Quasi Contracts",
            "Unit 7: Contract of Indemnity and Guarantee",
            "Unit 8: Bailment and Pledge",
            "Unit 9: Agency"
          ]
        },
        {
          title: "Ch 3: The Sale of Goods Act, 1930",
          units: [
            "Unit 1: Formation of the Contract of Sale",
            "Unit 2: Conditions & Warranties",
            "Unit 3: Transfer of Ownership and Delivery of Goods",
            "Unit 4: Unpaid Seller"
          ]
        },
        {
          title: "Ch 4: The Indian Partnership Act, 1932",
          units: [
            "Unit 1: General Nature of Partnership",
            "Unit 2: Relations of Partners",
            "Unit 3: Registration and Dissolution of a Firm"
          ]
        },
        {
          title: "Ch 5: The Limited Liability Partnership Act, 2008",
          units: ["Full Chapter Coverage: Meaning, Incorporation, Partners & Differences"]
        },
        {
          title: "Ch 6: The Companies Act, 2013",
          units: ["Meaning, Types of Companies, MOA, AOA & Incorporation"]
        },
        {
          title: "Ch 7: The Negotiable Instruments Act, 1881",
          units: ["Promissory Notes, Bills of Exchange, Cheques, Negotiation & Crossing"]
        }
      ]
    },
    p3: {
      name: "Paper 3: Quantitative Aptitude",
      chapters: [
        {
          title: "Part A: Business Mathematics",
          units: [
            "Ch 1: Ratio and Proportion, Indices, Logarithms",
            "Ch 2: Equations (Linear, Quadratic, Matrices)",
            "Ch 3: Linear Inequalities",
            "Ch 4: Mathematics of Finance (TVM, Annuities, Perpetuity)",
            "Ch 5: Basic Concepts of Permutations and Combinations",
            "Ch 6: Sequence and Series (Arithmetic & Geometric Progressions)",
            "Ch 7: Sets, Relations, Functions, Limits and Continuity",
            "Ch 8: Applications of Differential and Integral Calculus"
          ]
        },
        {
          title: "Part B: Logical Reasoning",
          units: [
            "Ch 9: Number Series, Coding-Decoding and Odd Man Out",
            "Ch 10: Direction Tests",
            "Ch 11: Seating Arrangements",
            "Ch 12: Blood Relations"
          ]
        },
        {
          title: "Part C: Statistics",
          units: [
            "Ch 13: Statistical Representation of Data & Sampling",
            "Ch 14: Measures of Central Tendency and Dispersion",
            "Ch 15: Probability",
            "Ch 16: Theoretical Distributions",
            "Ch 17: Correlation and Regression",
            "Ch 18: Index Numbers"
          ]
        }
      ]
    },
    p4: {
      name: "Paper 4: Business Economics",
      chapters: [
        {
          title: "Ch 1: Nature and Scope of Business Economics",
          units: [
            "Unit 1: Introduction to Business Economics",
            "Unit 2: Basic Problems of an Economy & Role of Price Mechanism"
          ]
        },
        {
          title: "Ch 2: Theory of Demand and Supply",
          units: [
            "Unit 1: Law of Demand and Elasticity of Demand",
            "Unit 2: Theory of Consumer Behaviour",
            "Unit 3: Supply and Elasticity of Supply"
          ]
        },
        {
          title: "Ch 3: Theory of Production and Cost",
          units: [
            "Unit 1: Theory of Production",
            "Unit 2: Theory of Cost"
          ]
        },
        {
          title: "Ch 4: Price Determination in Different Markets",
          units: [
            "Unit 1: Meaning and Types of Markets",
            "Unit 2: Determination of Prices",
            "Unit 3: Price-Output Determination under Different Forms"
          ]
        },
        {
          title: "Ch 5: Business Cycles",
          units: ["Full Chapter Coverage (Phases, Features & Causes)"]
        },
        {
          title: "Ch 6: Determination of National Income",
          units: [
            "Unit 1: National Income Accounting",
            "Unit 2: The Keynesian Theory of Determination of National Income"
          ]
        },
        {
          title: "Ch 7: Public Finance",
          units: [
            "Unit 1: Fiscal Functions: Overview, Centre & State Finance",
            "Unit 2: Market Failure / Government Intervention",
            "Unit 3: Budget Making: Revenue, Expenditure & Public Debt",
            "Unit 4: Fiscal Policy"
          ]
        },
        {
          title: "Ch 8: Money Market",
          units: [
            "Unit 1: Concept of Money Demand & Important Theories",
            "Unit 2: Concept of Money Supply",
            "Unit 3: Monetary Policy"
          ]
        },
        {
          title: "Ch 9: International Trade",
          units: [
            "Unit 1: Theories of International Trade",
            "Unit 2: Instruments of Trade Policy",
            "Unit 3: Trade Negotiations",
            "Unit 4: Exchange Rate and Its Economic Effects",
            "Unit 5: International Capital Movements"
          ]
        },
        {
          title: "Ch 10: Indian Economy",
          units: ["Post-Independence Trends, Agriculture, Industry, Services & Reforms"]
        }
      ]
    }
  };

  // Persistent storage state
  let appData = JSON.parse(localStorage.getItem("ca_found_revision_state")) || {
    completedUnits: {},
    rtpDone: {},
    mocksDone: {},
    examDate: "",
    targetDays: ""
  };

  function renderSubjectView() {
    const sub = document.getElementById("subject-select").value;
    
    // Set RTP & Mock fields for this subject
    document.getElementById("rtp-checkbox").checked = !!appData.rtpDone[sub];
    document.getElementById("sub-mock-count").value = appData.mocksDone[sub] || "";

    // Render Chapters & Nested Units
    const container = document.getElementById("chapters-accordion");
    container.innerHTML = "";

    SYLLABUS_TREE[sub].chapters.forEach((chap, cIdx) => {
      let unitsHtml = "";
      chap.units.forEach((unitTitle, uIdx) => {
        const key = `${sub}_c${cIdx}_u${uIdx}`;
        const isDone = appData.completedUnits[key] ? "checked" : "";
        unitsHtml += `
          <label class="unit-item">
            <input type="checkbox" onchange="toggleUnit('${key}', this.checked)" ${isDone}>
            <span>${unitTitle}</span>
          </label>`;
      });

      container.innerHTML += `
        <details class="chap-details" open>
          <summary class="chap-summary">
            <span>${chap.title}</span>
            <span style="font-size:12px; color:var(--muted);">${chap.units.length} unit(s)</span>
          </summary>
          <div class="chap-units">${unitsHtml}</div>
        </details>`;
    });
  }

  function toggleUnit(key, status) {
    if (status) appData.completedUnits[key] = true;
    else delete appData.completedUnits[key];
    saveToStorage();
  }

  function updateRtp(status) {
    const sub = document.getElementById("subject-select").value;
    appData.rtpDone[sub] = status;
    saveToStorage();
  }

  function updateSubMock(val) {
    const sub = document.getElementById("subject-select").value;
    appData.mocksDone[sub] = parseInt(val) || 0;
    saveToStorage();
  }

  function saveToStorage() {
    localStorage.setItem("ca_found_revision_state", JSON.stringify(appData));
  }

  function saveAndShowDashboard() {
    appData.examDate = document.getElementById("exam-date").value;
    appData.targetDays = document.getElementById("target-days").value;
    saveToStorage();

    document.getElementById("page-input").classList.add("hidden");
    document.getElementById("page-dashboard").classList.remove("hidden");
    buildDashboard();
  }

  function showInputPage() {
    document.getElementById("page-dashboard").classList.add("hidden");
    document.getElementById("page-input").classList.remove("hidden");
    renderSubjectView();
  }

  function buildDashboard() {
    let grandTotalUnits = 0;
    let grandDoneUnits = 0;
    let totalRtpCompleted = 0;
    let totalMocksAttempted = 0;

    const barsDiv = document.getElementById("subject-bars-container");
    barsDiv.innerHTML = "";

    Object.keys(SYLLABUS_TREE).forEach(subKey => {
      let subUnits = 0;
      let subDone = 0;

      SYLLABUS_TREE[subKey].chapters.forEach((chap, cIdx) => {
        chap.units.forEach((_, uIdx) => {
          subUnits++;
          if (appData.completedUnits[`${subKey}_c${cIdx}_u${uIdx}`]) subDone++;
        });
      });

      grandTotalUnits += subUnits;
      grandDoneUnits += subDone;

      if (appData.rtpDone[subKey]) totalRtpCompleted++;
      totalMocksAttempted += (appData.mocksDone[subKey] || 0);

      const subPct = Math.round((subDone / subUnits) * 100);
      const isRtp = appData.rtpDone[subKey] ? "✅ RTP Done" : "⏳ RTP Pending";
      const mocks = appData.mocksDone[subKey] || 0;

      barsDiv.innerHTML += `
        <div style="margin-top:12px;">
          <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:600;">
            <span>${SYLLABUS_TREE[subKey].name}</span>
            <span>${subPct}% (${subDone}/${subUnits} Units)</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${subPct}%"></div></div>
          <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:-10px;">
            <span>${isRtp}</span>
            <span>Mocks Written: ${mocks}</span>
          </div>
        </div>`;
    });

    // Readiness formula: 70% Syllabus Units + 15% RTPs (4 subjects) + 15% Mocks (Benchmark: 8 full mocks)
    const unitScore = (grandDoneUnits / grandTotalUnits) * 70;
    const rtpScore = (totalRtpCompleted / 4) * 15;
    const mockScore = Math.min(15, (totalMocksAttempted / 8) * 15);
    const overallScore = Math.round(unitScore + rtpScore + mockScore);

    document.getElementById("overall-bar").style.width = `${overallScore}%`;
    document.getElementById("overall-label").innerText = `${overallScore}% Readiness Score`;

    // Days Countdown
    const badge = document.getElementById("countdown-badge");
    if (appData.examDate) {
      const diff = Math.ceil((new Date(appData.examDate) - new Date()) / (1000 * 60 * 60 * 24));
      badge.innerText = diff > 0 ? `⏳ ${diff} days until exams` : "Exam period active";
    } else {
      badge.innerText = "📅 Exam date not specified";
    }

    // Planning Notes
    const summaryDiv = document.getElementById("planning-summary");
    if (appData.targetDays) {
      summaryDiv.innerHTML = `<strong>Study Target:</strong> Aiming for ${appData.targetDays} revision days per paper. Track completed units weekly to pace yourself before mock exams.`;
    } else {
      summaryDiv.innerHTML = "";
    }
  }

  // Initial Load
  document.getElementById("exam-date").value = appData.examDate || "";
  document.getElementById("target-days").value = appData.targetDays || "";
  renderSubjectView();
</script>
</body>
</html>
